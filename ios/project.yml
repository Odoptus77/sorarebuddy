# XcodeGen spec — generates SorareBuddy.xcodeproj from the Swift sources.
# On a Mac:  brew install xcodegen && cd ios && xcodegen generate
# then:      open SorareBuddy.xcodeproj   (or build from the CLI, see README)
name: SorareBuddy
options:
  bundleIdPrefix: com.sorarebuddy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
    DEVELOPMENT_TEAM: ""                  # set your Apple Developer Team ID to run on device
targets:
  SorareBuddy:
    type: application
    platform: iOS
    sources:
      - path: SorareBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sorarebuddy.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SorareBuddy/Info.plist
