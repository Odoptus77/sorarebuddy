# nginx alternative to Caddy. Put at /etc/nginx/sites-available/sorarebuddy,
# symlink into sites-enabled, then get a cert with certbot:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d sorarebuddy.example.com
# certbot rewrites this file to add the TLS listener and redirect.

server {
    listen 80;
    server_name sorarebuddy.example.com;

    # cold pipeline runs are slow — allow long upstream reads
    proxy_read_timeout 600s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
